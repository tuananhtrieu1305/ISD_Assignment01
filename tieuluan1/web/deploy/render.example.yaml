# Optional independent services. Set actual public URLs before deploy.
services:
  - type: web
    name: isd-tieuluan1-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: python -B scripts/render_project.py build --project tieuluan1
    startCommand: python -B scripts/render_project.py start --project tieuluan1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.17
      - key: AI_CORS_ORIGINS
        value: https://isd-tieuluan1-web.onrender.com
      - key: WEB_ORIGIN
        value: https://isd-tieuluan1-web.onrender.com
      - key: AI_SERVING_MODE
        value: cpu
  - type: web
    name: isd-tieuluan1-web
    runtime: static
    rootDir: tieuluan1/web/frontend
    buildCommand: npm ci --no-fund --no-audit && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: VITE_API_BASE_URL
        value: https://isd-tieuluan1-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
