[project]
name = "ai-term-paper-v3"
version = "3.0.0"
description = "Reproducible AI term-paper experiments on WSL2"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2.3,<2.5",
  "pandas>=2.3,<3.1",
  "scikit-learn==1.9.0",
  "scipy>=1.15,<2",
  "joblib>=1.5,<2",
  "matplotlib>=3.10,<4",
  "seaborn>=0.13,<0.14",
  "pillow>=12,<13",
  "openpyxl>=3.1,<4",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
  "tqdm>=4.67,<5",
  "networkx>=3.4,<4",
  "keras==3.15.1",
  "h5py==3.14.0",
  "flask>=3.1,<4",
  "flask-cors>=6,<7",
  "gunicorn>=23,<24",
  "ipykernel>=6.30,<8",
  "jupyterlab>=4.4,<5",
  "nbformat>=5.10,<6",
  "python-docx>=1.2,<2",
  "pypdf>=6,<7",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[project.optional-dependencies]
torch = ["torch==2.14.1+cu130"]
keras = ["tensorflow[and-cuda]==2.21.0"]
keras-torch = ["torch==2.14.1+cu130"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [
  [{extra = "torch"}, {extra = "keras"}],
  [{extra = "keras-torch"}, {extra = "keras"}],
]

[tool.uv.sources]
torch = {index = "pytorch-cu130"}

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 110

