<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Các mốc phát triển chính của trí tuệ nhân tạo</title>
  <desc id="desc">Timeline bốn giai đoạn từ nền tảng logic và neuron nhân tạo đến mô hình nền tảng và AI tạo sinh.</desc>
  <defs>
    <style>
      .title { font: 700 40px 'Times New Roman', serif; fill: #17365d; }
      .period { font: 700 27px 'Times New Roman', serif; fill: #ffffff; }
      .year { font: 700 25px 'Times New Roman', serif; fill: #17365d; }
      .event { font: 22px 'Times New Roman', serif; fill: #1f2933; }
      .note { font: italic 18px 'Times New Roman', serif; fill: #5b6570; }
      .card { fill: #ffffff; stroke: #9fbad0; stroke-width: 2; rx: 14; }
      .arrow { stroke: #5b6570; stroke-width: 5; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L10,4 z" fill="#5b6570"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#17365d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1600" height="1050" fill="#f7f9fb"/>
  <text x="800" y="58" text-anchor="middle" class="title">CÁC MỐC PHÁT TRIỂN CHÍNH CỦA AI</text>
  <path d="M385 515 H430 M775 515 H820 M1165 515 H1210" class="arrow" marker-end="url(#arrowhead)"/>

  <g transform="translate(40,105)">
    <rect width="345" height="815" rx="18" fill="#e9f2f9" stroke="#2f75b5" stroke-width="3"/>
    <rect width="345" height="78" rx="18" fill="#2f75b5"/>
    <rect y="55" width="345" height="23" fill="#2f75b5"/>
    <text x="172.5" y="49" text-anchor="middle" class="period">NỀN TẢNG</text>
    <g transform="translate(20,110)" filter="url(#shadow)">
      <rect width="305" height="160" class="card"/>
      <text x="20" y="40" class="year">1943</text>
      <text x="20" y="78" class="event">Neuron logic</text>
      <text x="20" y="110" class="event">McCulloch–Pitts</text>
    </g>
    <g transform="translate(20,300)" filter="url(#shadow)">
      <rect width="305" height="160" class="card"/>
      <text x="20" y="40" class="year">1950</text>
      <text x="20" y="78" class="event">Turing và</text>
      <text x="20" y="110" class="event">Imitation Game</text>
    </g>
    <g transform="translate(20,490)" filter="url(#shadow)">
      <rect width="305" height="185" class="card"/>
      <text x="20" y="40" class="year">1955–1956</text>
      <text x="20" y="78" class="event">Đề xuất và dự án</text>
      <text x="20" y="110" class="event">mùa hè Dartmouth;</text>
      <text x="20" y="142" class="event">tên gọi AI</text>
    </g>
  </g>

  <g transform="translate(430,105)">
    <rect width="345" height="815" rx="18" fill="#fff4dc" stroke="#e69f00" stroke-width="3"/>
    <rect width="345" height="78" rx="18" fill="#c78600"/>
    <rect y="55" width="345" height="23" fill="#c78600"/>
    <text x="172.5" y="34" text-anchor="middle" class="period">BIỂU TƯỢNG VÀ</text>
    <text x="172.5" y="64" text-anchor="middle" class="period">HỌC TỪ DỮ LIỆU</text>
    <g transform="translate(20,110)" filter="url(#shadow)">
      <rect width="305" height="175" class="card"/>
      <text x="20" y="40" class="year">1957–1958</text>
      <text x="20" y="78" class="event">Logic Theory Machine;</text>
      <text x="20" y="110" class="event">perceptron học</text>
      <text x="20" y="142" class="event">từ ví dụ</text>
    </g>
    <g transform="translate(20,315)" filter="url(#shadow)">
      <rect width="305" height="175" class="card"/>
      <text x="20" y="40" class="year">1966–1973</text>
      <text x="20" y="78" class="event">ALPAC, Lighthill;</text>
      <text x="20" y="110" class="event">điều chỉnh kỳ vọng</text>
      <text x="20" y="142" class="event">và tài trợ</text>
    </g>
    <g transform="translate(20,520)" filter="url(#shadow)">
      <rect width="305" height="160" class="card"/>
      <text x="20" y="40" class="year">1986</text>
      <text x="20" y="78" class="event">Backpropagation</text>
      <text x="20" y="110" class="event">cho mạng nhiều lớp</text>
    </g>
  </g>

  <g transform="translate(820,105)">
    <rect width="345" height="815" rx="18" fill="#e5f5ef" stroke="#009e73" stroke-width="3"/>
    <rect width="345" height="78" rx="18" fill="#007f5f"/>
    <rect y="55" width="345" height="23" fill="#007f5f"/>
    <text x="172.5" y="49" text-anchor="middle" class="period">DEEP LEARNING</text>
    <g transform="translate(20,100)" filter="url(#shadow)">
      <rect width="305" height="140" class="card"/>
      <text x="20" y="40" class="year">1997</text>
      <text x="20" y="78" class="event">LSTM; Deep Blue</text>
      <text x="20" y="110" class="event">thắng trận tái đấu</text>
    </g>
    <g transform="translate(20,260)" filter="url(#shadow)">
      <rect width="305" height="130" class="card"/>
      <text x="20" y="40" class="year">2009</text>
      <text x="20" y="82" class="event">ImageNet</text>
    </g>
    <g transform="translate(20,410)" filter="url(#shadow)">
      <rect width="305" height="140" class="card"/>
      <text x="20" y="40" class="year">2012</text>
      <text x="20" y="78" class="event">AlexNet, CNN sâu</text>
      <text x="20" y="110" class="event">và GPU</text>
    </g>
    <g transform="translate(20,570)" filter="url(#shadow)">
      <rect width="305" height="155" class="card"/>
      <text x="20" y="40" class="year">2016–2017</text>
      <text x="20" y="78" class="event">AlphaGo;</text>
      <text x="20" y="110" class="event">Transformer</text>
    </g>
  </g>

  <g transform="translate(1210,105)">
    <rect width="345" height="815" rx="18" fill="#f0ecf8" stroke="#6f4aa8" stroke-width="3"/>
    <rect width="345" height="78" rx="18" fill="#6f4aa8"/>
    <rect y="55" width="345" height="23" fill="#6f4aa8"/>
    <text x="172.5" y="34" text-anchor="middle" class="period">MÔ HÌNH NỀN TẢNG</text>
    <text x="172.5" y="64" text-anchor="middle" class="period">VÀ AI TẠO SINH</text>
    <g transform="translate(20,110)" filter="url(#shadow)">
      <rect width="305" height="175" class="card"/>
      <text x="20" y="40" class="year">2020</text>
      <text x="20" y="78" class="event">GPT-3 và</text>
      <text x="20" y="110" class="event">diffusion model</text>
    </g>
    <g transform="translate(20,315)" filter="url(#shadow)">
      <rect width="305" height="175" class="card"/>
      <text x="20" y="40" class="year">2021</text>
      <text x="20" y="78" class="event">Khung khái niệm</text>
      <text x="20" y="110" class="event">foundation model</text>
    </g>
    <g transform="translate(20,520)" filter="url(#shadow)">
      <rect width="305" height="175" class="card"/>
      <text x="20" y="40" class="year">2022</text>
      <text x="20" y="78" class="event">ChatGPT</text>
      <text x="20" y="110" class="event">research preview</text>
    </g>
  </g>

  <text x="800" y="985" text-anchor="middle" class="note">Tiến bộ phụ thuộc đồng thời vào biểu diễn, thuật toán, dữ liệu, năng lực tính toán và đánh giá.</text>
  <text x="800" y="1018" text-anchor="middle" class="note">Nguồn mốc: timeline_sources.csv; tài liệu đầy đủ trong bibliography.bib.</text>
</svg>
