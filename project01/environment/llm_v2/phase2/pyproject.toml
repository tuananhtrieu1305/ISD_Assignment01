[project]
name = "project01-gemini-serving"
version = "2.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "google-genai==2.34.0",
  "langchain-core==1.7.3",
  "langchain-text-splitters==1.1.3",
  "pydantic==2.14.2",
  "rank-bm25==0.2.2",
  "Flask==3.1.3",
  "numpy==2.4.6",
  "gunicorn==26.2.0",
]

[dependency-groups]
notebook = ["ipykernel==7.4.0", "pyvis==0.3.2", "matplotlib>=3.10,<4"]

[tool.uv]
package = false
default-groups = ["notebook"]
