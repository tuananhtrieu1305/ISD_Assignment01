# Template only: no service was created or deployed by Phase 2.
services:
  - type: web
    name: project01-diabetes-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: python -B project01/scripts/render.py build
    startCommand: python -B project01/scripts/render.py start
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.17
      - key: WEB_ORIGIN
        value: https://project01-diabetes-web.onrender.com
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
  - type: web
    name: project01-diabetes-web
    runtime: static
    rootDir: project01/web/frontend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: VITE_API_BASE_URL
        value: https://project01-diabetes-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
