# REORG Phase3. Existing manual services need a one-time Settings update.
# Existing manual services require a one-time Dashboard configuration update.
services:
  - type: web
    name: isd-assignment01-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: python -B scripts/render_project.py build --project tieuluan3
    startCommand: python -B scripts/render_project.py start --project tieuluan3
    buildFilter:
      paths:
        - scripts/render_project.py
        - tieuluan3/src/**
        - tieuluan3/scripts/render_v3.py
        - tieuluan3/web/backend/**
        - tieuluan3/web/deploy/**
        - render.yaml
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.17
      - key: NODE_VERSION
        value: 22.23.4
      - key: AI_SERVING_MODE
        value: cpu
      - key: AI_CORS_ORIGINS
        value: https://isd-assignment01-web.onrender.com
      - key: AI_TRUSTED_HOSTS
        value: localhost,127.0.0.1,.onrender.com
      - key: AI_JOB_DB
        value: /tmp/ai-paper-v3/jobs.db
      - key: OPENBLAS_NUM_THREADS
        value: '1'
      - key: OMP_NUM_THREADS
        value: '1'
      - key: PYTHONDONTWRITEBYTECODE
        value: '1'

  - type: web
    name: isd-assignment01-web
    runtime: static
    buildFilter:
      paths:
        - tieuluan3/web/frontend/**
        - render.yaml
    rootDir: tieuluan3/web/frontend
    buildCommand: npm ci --no-fund --no-audit && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: SKIP_INSTALL_DEPS
        value: 'true'
      - key: VITE_API_BASE_URL
        value: https://isd-assignment01-api.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://isd-assignment01-api.onrender.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
