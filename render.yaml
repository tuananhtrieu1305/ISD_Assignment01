services:
  - type: web
    name: ai-term-paper-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt && python -c "from backend.app import app; print('Model hashes verified')"
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: RATE_LIMIT_PER_MINUTE
        value: 120
      - key: WEB_ORIGIN
        fromService:
          type: web
          name: ai-term-paper-web
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  - type: web
    name: ai-term-paper-web
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: ./web/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ai-term-paper-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
