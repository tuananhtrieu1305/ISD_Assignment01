<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
<rect width="100%" height="100%" fill="#f8fafc"/>
<style>text{font-family:Arial,sans-serif}.title{font-size:22px;font-weight:700;fill:#0f172a}.type{font-size:13px;font-weight:700;fill:#1d4ed8}.label{font-size:12px;fill:#334155}.edge{font-size:11px;fill:#7c3aed}.box{fill:#fff;stroke:#2563eb;stroke-width:2;rx:10}</style>
<text x="35" y="38" class="title">Medical KG — sample path</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker></defs>
<rect class="box" x="35" y="92" width="190" height="78"/>
<text class="type" x="130" y="120" text-anchor="middle">Document</text>
<text class="label" x="130" y="145" text-anchor="middle">Diabetes</text>
<line x1="225" y1="131" x2="270" y2="131" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
<text class="edge" x="252" y="119" text-anchor="middle">DESCRIBES</text>
<rect class="box" x="280" y="92" width="190" height="78"/>
<text class="type" x="375" y="120" text-anchor="middle">MedicalEntity</text>
<text class="label" x="375" y="145" text-anchor="middle">Diabetes</text>
<line x1="470" y1="131" x2="515" y2="131" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
<text class="edge" x="497" y="119" text-anchor="middle">SAME_AS</text>
<rect class="box" x="525" y="92" width="190" height="78"/>
<text class="type" x="620" y="120" text-anchor="middle">WikidataEntity</text>
<text class="label" x="620" y="145" text-anchor="middle">diabetes</text>
<text class="label" x="35" y="220">Đường đi được truy vấn trực tiếp từ adjacency.json; không cần Neo4j.</text>
</svg>