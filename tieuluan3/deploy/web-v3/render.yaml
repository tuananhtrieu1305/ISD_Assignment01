services:
  - type: web
    name: ai-model-lab-v3-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci --no-fund --no-audit && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https: http://127.0.0.1:5000 http://localhost:5000; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
