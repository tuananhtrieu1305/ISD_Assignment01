services:
  - type: web
    name: isd-assignment01-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r apps/api/requirements.txt && python -B scripts/phase20_verify.py --deploy
    startCommand: gunicorn apps.api.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: RATE_LIMIT_PER_MINUTE
        value: 120
      - key: AGENT_TIMEOUT_MS
        value: 8000
      - key: WEB_ORIGIN
        fromService:
          type: web
          name: isd-assignment01-web
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  - type: web
    name: isd-assignment01-web
    runtime: static
    buildCommand: cd apps/web && npm ci && npm run build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: isd-assignment01-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://*.onrender.com; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
